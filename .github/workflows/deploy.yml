name: QuranGraph CI & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    name: Test & Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Ingest Pipeline Setup & Verification
        run: |
          cd ingest
          uv sync
          uv run fetch/fetch.py
          uv run core/build_text.py
          uv run stats/numbers_lab.py
          uv run graph/build_kg.py
          ./qg check all
          uv run python3 -m unittest discover -s . -p "test_*.py"

      - name: Run Web Search Golden Tests
        run: |
          node --test "web/tests/*.test.ts"

      - name: Build Static Astro Website
        run: |
          cd web
          npm ci
          npm run build

      - name: Deploy to Cloudflare Workers Static Assets
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
