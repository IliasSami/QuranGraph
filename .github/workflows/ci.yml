name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run normaliser tests
        run: node --test "web/tests/*.test.ts"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: |
          cd ingest
          uv sync

      - name: Cache raw Quran sources
        uses: actions/cache@v4
        id: cache-raw-sources
        with:
          path: ingest/work/raw
          key: raw-sources-${{ hashFiles('ingest/sources.lock.json') }}

      - name: Fetch sources
        run: |
          cd ingest
          uv run fetch/fetch.py

      - name: Build text core database
        run: |
          cd ingest
          uv run core/build_text.py

      - name: Validate all explained ayat
        run: |
          ingest/qg check all
