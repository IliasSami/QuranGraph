# ---- linguistic data
- id: morphology
  kind: url
  file: quran-morphology.txt
  src: https://raw.githubusercontent.com/mustafa0x/quran-morphology/master/quran-morphology.txt
  title: Quran morphology (corrected Quranic Arabic Corpus v0.4)
  publisher: Mustafa Jibaly, based on the Quranic Arabic Corpus (Kais Dukes, University of Leeds)
  licence: GNU GPL (Quranic Arabic Corpus terms); derived data published as a separate GPL bundle with notice + link to corpus.quran.com
  attribution: Morphology from the Quranic Arabic Corpus (corpus.quran.com), corrected by github.com/mustafa0x/quran-morphology
  use: data
  status: permission-requested   # clarify the "no changes" clause with Kais Dukes
- id: morphology-terms
  kind: url
