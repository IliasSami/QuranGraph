# Every external source QuranGraph uses. `ingest/fetch/fetch.py` downloads them into work/raw/<id>/ and records
# version + SHA-256 in sources.lock.json (committed), so every build is reproducible and auditable.
#
#   use: display    shown to readers verbatim (licence must allow republishing)
#        data       factual structure / linguistic data (shipped as derived data with its licence notice)
#        grounding  read by the build-time explanation step only; NEVER shipped in the website files
#   status: ok | permission-requested | permission-needed

- id: tanzil-uthmani
  kind: tanzil_text
  quranType: uthmani
  title: Tanzil Quran Text (Uthmani, v1.1)
  publisher: Tanzil Project
  url: https://tanzil.net/download/
  licence: CC BY 3.0, verbatim copies only (changing the text is not allowed)
  attribution: Quran text from the Tanzil Project (tanzil.net)
  use: display
  status: ok

- id: tanzil-simple-clean
  kind: tanzil_text
  quranType: simple-clean
  title: Tanzil Quran Text (Simple Clean, v1.1)
  publisher: Tanzil Project
  url: https://tanzil.net/download/
  licence: CC BY 3.0, verbatim copies only
  attribution: Quran text from the Tanzil Project (tanzil.net)
  use: data   # search index only, never displayed as the Quran text
  status: ok

- id: tanzil-metadata
  kind: url
  file: quran-data.xml
  src: https://tanzil.net/res/text/metadata/quran-data.xml
  title: Tanzil Quran Metadata
  publisher: Tanzil Project
  licence: CC BY (as declared in the file)
  attribution: Quran metadata from the Tanzil Project (tanzil.net)
  use: data
  status: ok

