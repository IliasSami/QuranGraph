<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#0f766e"/>
  <!-- Islamic Eight-Point Star (Rub el Hizb) -->
  <g transform="translate(50, 50)" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linejoin="round">
    <rect x="-24" y="-24" width="48" height="48" rx="4"/>
    <rect x="-24" y="-24" width="48" height="48" rx="4" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="8" fill="#fef3c7"/>
  </g>
</svg>
