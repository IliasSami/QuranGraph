<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(45, 212, 191, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="180" r="280" fill="#0f766e" opacity="0.18" filter="blur(60px)" />
  <circle cx="1020" cy="460" r="240" fill="#d97706" opacity="0.12" filter="blur(70px)" />

  <!-- Outer Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="none" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1" />

  <!-- Top Badge -->
  <g transform="translate(80, 85)">
    <rect x="0" y="0" width="310" height="36" rx="18" fill="rgba(15, 118, 110, 0.25)" stroke="#14b8a6" stroke-width="1.2" />
    <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#2dd4bf" letter-spacing="1.5">
      OPEN SOURCE QURAN PLATFORM
    </text>
  </g>

  <!-- Islamic Emblem & Logo -->
  <g transform="translate(80, 160)">
    <text x="0" y="80" font-family="'Amiri Quran', 'Amiri', serif" font-size="95" fill="url(#gold)">۞</text>
    <text x="110" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Quran<tspan fill="url(#accent)">Graph</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <text x="80" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#e2e8f0">
    Connected Quran Knowledge Graph, Multilingual Search &amp; Lexicon
  </text>
  <text x="80" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Linking 6,236 verses, 884 entities, 1,651 roots, and prophetic story cycles in English, বাংলা &amp; عربي.
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(80, 390)">
    <!-- Badge 1: 884 Entities -->
    <rect x="0" y="0" width="235" height="74" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#2dd4bf">884 Entities</text>
    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Prophets, Places &amp; Unseen</text>

    <!-- Badge 2: 1,651 Roots -->
    <rect x="255" y="0" width="235" height="74" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="275" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#fbbf24">1,651 Roots</text>
    <text x="275" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Triliteral Morphological Lexicon</text>

    <!-- Badge 3: 58 Core Lemmas -->
    <rect x="510" y="0" width="235" height="74" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="530" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">50% Vocabulary</text>
    <text x="530" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Mastery with 58 Lemmas</text>

    <!-- Badge 4: Multilingual -->
    <rect x="765" y="0" width="275" height="74" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="785" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#a78bfa">English · বাংলা · عربي</text>
    <text x="785" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Smart Phonetic Search &amp; Tafsir</text>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(80, 520)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">
      https://qurangraph.com · 100% Free · No Ads · Open Source MIT
    </text>
  </g>
</svg>
